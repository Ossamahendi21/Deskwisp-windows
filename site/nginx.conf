# deskwisp.bot: the landing page, as plain files. HTML is always fresh; everything else is cached a day.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # www.deskwisp.bot and the fly.dev name go to deskwisp.bot.
  if ($host ~* ^(www\.deskwisp\.bot|deskwisp-site\.fly\.dev)$) { return 301 https://deskwisp.bot$request_uri; }

  location = /health { access_log off; return 200 "ok"; }
  location ~* \.(css|js|svg|png)$ { expires 1d; add_header Cache-Control "public"; }
  location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
}

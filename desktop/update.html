<!doctype html>
<!--
  The update screen (desktop/win-main.cjs, desktop/win-update.cjs), in the Deskwisp window:
  - ?phase=ready: a newer version, downloaded before Deskwisp was last closed, offered at launch:
    "Update ready", Restart to update, or Later (the app, on this version).
  - ?phase=updating: Restart to update under way. Wispy (lib/mascot.ts) curls up while sparks circle it,
    and the bar follows the steps the PC app sends (saving, closing, installing, opening), easing
    forward between them so it never sits still. Then Deskwisp closes, the installer runs, and it opens
    the new version.
  CSS animation only, transform and opacity; still with reduced motion. Text goes in as text, never HTML.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Updating Deskwisp</title>
<style>
  :root { --ink: #16132B; --muted: #6B6B6B; --faint: #9A9A98; --track: #E4E4E1; --accent: #7C5CFF; --paper: #F7F7F6; }
  html, body { margin: 0; height: 100%; background: var(--paper); }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: 13px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--muted);
    -webkit-app-region: drag; user-select: none;
  }
  .card { display: flex; flex-direction: column; align-items: center; width: 300px; text-align: center; }
  button, a { -webkit-app-region: no-drag; }

  /* Wispy, on a soft tile. */
  .tile { position: relative; width: 112px; height: 112px; border-radius: 30px; background: #F0F0EE; display: grid; place-items: center; margin-bottom: 22px; }
  .wisp { width: 64px; height: 64px; transition: transform .5s cubic-bezier(.3,1.4,.5,1); }
  .ready .wisp { animation: breathe 3.2s ease-in-out infinite; }
  .updating .wisp { transform: scale(.62); animation: bob 1.1s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.03); } }
  @keyframes bob { 0%, 100% { transform: scale(.62) translateY(-2px) rotate(-6deg); } 50% { transform: scale(.62) translateY(2px) rotate(6deg); } }

  /* While it updates: three sparks circle Wispy, each its own size and pace. */
  .orbit { position: absolute; inset: 0; opacity: 0; transition: opacity .4s; }
  .updating .orbit { opacity: 1; }
  .orbit i { position: absolute; left: 50%; top: 50%; border-radius: 50%; background: var(--ink); }
  .orbit .a { width: 7px; height: 7px; margin: -3.5px; animation: spin 1.6s linear infinite; --r: 30px; }
  .orbit .b { width: 5px; height: 5px; margin: -2.5px; animation: spin 2.4s linear infinite reverse; --r: 34px; background: var(--accent); }
  .orbit .c { width: 4px; height: 4px; margin: -2px; animation: spin 2s linear infinite; animation-delay: -.7s; --r: 26px; opacity: .45; }
  @keyframes spin { from { transform: rotate(0deg) translateX(var(--r)) rotate(0deg); } to { transform: rotate(360deg) translateX(var(--r)) rotate(-360deg); } }

  /* The spark on Wispy's head twinkles when it's ready. */
  .spark { transform-origin: 33px 7.2px; }
  .ready .spark { animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%, 70%, 100% { transform: scale(1) rotate(0deg); } 82% { transform: scale(1.35) rotate(20deg); } }

  h1 { margin: 0 0 4px; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--ink); }
  /* "Updating Deskwisp", a light passing over it. */
  .updating h1 {
    color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(90deg, #A8A8A5 0%, #A8A8A5 30%, var(--ink) 45%, var(--ink) 55%, #A8A8A5 70%, #A8A8A5 100%);
    background-size: 260% 100%; animation: shine 1.8s linear infinite;
  }
  @keyframes shine { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .line { margin: 0; min-height: 20px; }

  .bar { position: relative; width: 240px; height: 8px; margin-top: 22px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar b { position: absolute; inset: 0; border-radius: 4px; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); }
  .ready .bar b { transform: scaleX(1); }
  .under { margin-top: 10px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 19px; }

  ul { list-style: none; margin: 10px 0 0; padding: 0; display: none; flex-direction: column; gap: 2px; max-width: 280px; }
  .ready ul.has { display: flex; }
  li { font-size: 12px; line-height: 16px; color: var(--muted); }
  li::before { content: "·"; margin-right: 6px; color: var(--faint); }

  .go { display: none; margin-top: 22px; padding: 8px 16px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .go:hover { background: #2A2742; }
  .go:focus-visible, .later:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .later { display: none; margin-top: 10px; border: 0; background: none; color: var(--faint); font: inherit; font-size: 12.5px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .later:hover { color: var(--ink); }
  .ready .go, .ready .later { display: inline-block; }
  .oops { color: #B42318; }

  @media (prefers-reduced-motion: reduce) {
    .wisp, .orbit i, .spark, .updating h1 { animation: none !important; }
    .updating h1 { color: var(--ink); background: none; }
  }
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="tile" aria-hidden="true">
      <div class="orbit"><i class="a"></i><i class="b"></i><i class="c"></i></div>
      <svg class="wisp" viewBox="0 0 40 40"><path d="M21.5 2.5c-.6 3.4 1.4 5.6 4.6 7.6C31.2 13.4 35 18.2 35 24.6 35 32 28.6 37.5 20 37.5S5 32 5 24.6c0-4.9 2.6-8.8 6-11.4.1 2.4 1.2 4.1 3.1 4.9-.4-6.2 2.3-11.5 7.4-15.6z" fill="#16132B"/><path d="M25.2 15.2c2.6 1.2 4.6 3.1 5.7 5.6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".35"/><ellipse cx="15.3" cy="25.1" rx="1.9" ry="2.6" fill="#fff"/><ellipse cx="24.7" cy="25.1" rx="1.9" ry="2.6" fill="#fff"/><path class="spark" d="M33 3.2c.4 2.6 1.4 3.6 4 4-2.6.4-3.6 1.4-4 4-.4-2.6-1.4-3.6-4-4 2.6-.4 3.6-1.4 4-4z" fill="#7C5CFF"/></svg>
    </div>
    <h1 id="title">Update ready</h1>
    <p class="line" id="line">Restart to finish. It takes a few seconds.</p>
    <div class="bar" role="progressbar" aria-labelledby="title" aria-valuemin="0" aria-valuemax="100" id="bar"><b id="fill"></b></div>
    <div class="under" id="under" aria-live="polite"></div>
    <ul id="notes" aria-label="What's new"></ul>
    <button class="go" id="go">Restart to update</button>
    <button class="later" id="later">Later</button>
  </main>
<script>
  const q = new URLSearchParams(location.search);
  const update = window.deskwispMac && window.deskwispMac.update;
  const $ = (id) => document.getElementById(id);
  const version = /^\d+\.\d+\.\d+$/.test(q.get("version") || "") ? q.get("version") : "";
  const LINES = {
    saving: "Saving your bots and chats…",
    closing: "Closing Deskwisp…",
    installing: version ? `Installing Deskwisp ${version}…` : "Installing the new version…",
    opening: "Deskwisp opens again in a few seconds.",
  };

  let target = 0.04;
  let shown = 0;
  let timer;
  function draw() {
    // Toward the step the app is at, and a little past it while that step runs, so the bar keeps moving.
    const goal = target >= 1 ? 1 : Math.min(target + 0.18, 0.96);
    // Quickly up to where the app is, then slowly on.
    shown += (goal - shown) * (target >= 1 ? 0.3 : shown < target ? 0.15 : 0.02);
    if (goal - shown < 0.002) shown = goal;
    $("fill").style.transform = `scaleX(${shown.toFixed(4)})`;
    const pct = Math.round(shown * 100);
    $("under").textContent = `${pct}%`;
    $("bar").setAttribute("aria-valuenow", String(pct));
  }

  function phase(name) {
    document.body.className = name;
    if (name === "updating") {
      document.title = "Updating Deskwisp";
      $("title").textContent = "Updating Deskwisp";
      $("line").textContent = LINES.saving;
      $("line").classList.remove("oops");
      clearInterval(timer);
      timer = setInterval(draw, 100);
      draw();
    } else {
      document.title = "Update ready";
      $("title").textContent = "Update ready";
      $("line").textContent = "Restart to finish. It takes a few seconds.";
      $("under").textContent = version ? `Deskwisp ${version}` : "";
      $("bar").setAttribute("aria-valuenow", "100");
    }
  }

  function heard(s) {
    if (!s) return;
    if (s.state === "installing") {
      if (document.body.className !== "updating") phase("updating");
      if (typeof s.progress === "number") target = Math.max(target, Math.min(1, s.progress));
      if (LINES[s.step]) $("line").textContent = LINES[s.step];
    }
    if (document.body.className === "ready" && Array.isArray(s.notes) && s.notes.length) {
      const ul = $("notes");
      ul.replaceChildren(...s.notes.slice(0, 3).map((n) => Object.assign(document.createElement("li"), { textContent: String(n) })));
      ul.classList.add("has");
    }
  }

  phase(q.get("phase") === "updating" ? "updating" : "ready");
  if (update) {
    update.onStatus(heard);
    update.status().then(heard).catch(() => {});
  }
  $("go").addEventListener("click", async () => {
    phase("updating");
    try {
      const ok = await update.install();
      if (ok === false) throw new Error("not ready");
    } catch {
      $("line").textContent = "Couldn't start the update. Deskwisp opens as it is.";
      $("line").classList.add("oops");
      setTimeout(() => update && update.later(), 1800);
    }
  });
  $("later").addEventListener("click", () => update && update.later());
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.body.className === "ready" && update) update.later();
  });
</script>
</body>
</html>

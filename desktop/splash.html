<!doctype html>
<!--
  What the Deskwisp window shows while its server starts: Wispy (lib/mascot.ts, the main bot awake, as on
  deskwisp.bot) bobbing gently while sparks drift up off it. CSS only,
  transform and opacity only, and still with reduced motion. components/app/mascot.tsx (WispLoading)
  draws the same scene for the app's own first load, so one hands over to the other without a jump.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deskwisp</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 13px/1.5 -apple-system, system-ui, sans-serif; color: #6B6B6B; -webkit-app-region: drag; user-select: none; }
  .scene { position: relative; width: 88px; height: 96px; }
  .wisp { position: absolute; left: 0; top: 0; width: 88px; height: 88px; transform-origin: 50% 90%; animation: bop 1.1s ease-in-out infinite; }
  .shadow { position: absolute; left: 22px; bottom: 0; width: 44px; height: 6px; border-radius: 50%; background: #16132B; opacity: 0.08; animation: shadow 0.55s ease-in-out infinite; }
  .note { position: absolute; top: 34px; width: 14px; height: 14px; opacity: 0; animation-duration: 2.2s; animation-timing-function: cubic-bezier(.2,.6,.35,1); animation-iteration-count: infinite; }
  .note.l { left: 4px; animation-name: note-l; }
  .note.r { right: 4px; animation-name: note-r; }
  .note:nth-of-type(2) { animation-delay: 0.55s; }
  .note:nth-of-type(3) { animation-delay: 1.1s; }
  .note:nth-of-type(4) { animation-delay: 1.65s; }
  /* Two beats a bar: down on each beat, leaning one way then the other. */
  @keyframes bop {
    0%, 100% { transform: translateY(-3px) rotate(-5deg); }
    25% { transform: translateY(3px) rotate(0deg) scale(1.04, 0.95); }
    50% { transform: translateY(-3px) rotate(5deg); }
    75% { transform: translateY(3px) rotate(0deg) scale(1.04, 0.95); }
  }
  @keyframes shadow { 0%, 100% { transform: scaleX(0.85); opacity: 0.06; } 50% { transform: scaleX(1.05); opacity: 0.1; } }
  @keyframes note-l {
    0% { transform: translate(0, 0) rotate(0deg) scale(0.5); opacity: 0; }
    20% { opacity: 1; transform: translate(-8px, -10px) rotate(-6deg) scale(1); }
    70% { opacity: 0.9; }
    100% { transform: translate(-24px, -46px) rotate(-18deg) scale(0.85); opacity: 0; }
  }
  @keyframes note-r {
    0% { transform: translate(0, 0) rotate(0deg) scale(0.5); opacity: 0; }
    20% { opacity: 1; transform: translate(8px, -10px) rotate(6deg) scale(1); }
    70% { opacity: 0.9; }
    100% { transform: translate(24px, -46px) rotate(18deg) scale(0.85); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .wisp, .shadow { animation: none; } .note { display: none; } }
</style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="shadow"></div>
    <svg class="note l" viewBox="0 0 24 24"><g fill="#7C5CFF"><path d="M12 2c.7 4.6 2.6 6.6 7.2 7.2-4.6.7-6.5 2.6-7.2 7.2-.7-4.6-2.6-6.5-7.2-7.2C9.4 8.6 11.3 6.6 12 2z"/></g></svg>
    <svg class="note r" viewBox="0 0 24 24"><g fill="#16132B"><path d="M12 4c.5 3.4 1.9 4.8 5.3 5.3-3.4.5-4.8 1.9-5.3 5.3-.5-3.4-1.9-4.8-5.3-5.3C10.1 8.8 11.5 7.4 12 4z"/><circle cx="18.5" cy="17.5" r="1.6"/></g></svg>
    <svg class="note l" viewBox="0 0 24 24"><g fill="#7C5CFF"><path d="M12 2c.7 4.6 2.6 6.6 7.2 7.2-4.6.7-6.5 2.6-7.2 7.2-.7-4.6-2.6-6.5-7.2-7.2C9.4 8.6 11.3 6.6 12 2z"/></g></svg>
    <svg class="note r" viewBox="0 0 24 24"><g fill="#16132B"><path d="M12 4c.5 3.4 1.9 4.8 5.3 5.3-3.4.5-4.8 1.9-5.3 5.3-.5-3.4-1.9-4.8-5.3-5.3C10.1 8.8 11.5 7.4 12 4z"/><circle cx="18.5" cy="17.5" r="1.6"/></g></svg>
    <svg class="wisp" viewBox="0 0 40 40"><path d="M21.5 2.5c-.6 3.4 1.4 5.6 4.6 7.6C31.2 13.4 35 18.2 35 24.6 35 32 28.6 37.5 20 37.5S5 32 5 24.6c0-4.9 2.6-8.8 6-11.4.1 2.4 1.2 4.1 3.1 4.9-.4-6.2 2.3-11.5 7.4-15.6z" fill="#16132B"/><path d="M25.2 15.2c2.6 1.2 4.6 3.1 5.7 5.6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".35"/><ellipse cx="15.3" cy="25.1" rx="1.9" ry="2.6" fill="#fff"/><ellipse cx="24.7" cy="25.1" rx="1.9" ry="2.6" fill="#fff"/><path d="M33 3.2c.4 2.6 1.4 3.6 4 4-2.6.4-3.6 1.4-4 4-.4-2.6-1.4-3.6-4-4 2.6-.4 3.6-1.4 4-4z" fill="#7C5CFF"/></svg>
  </div>
  <div>Starting Deskwisp…</div>
</body>
</html>

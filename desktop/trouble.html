<!doctype html>
<!--
  What the Deskwisp window shows when Deskwisp can't start (desktop/main.cjs showTrouble), instead of a blank
  window: what went wrong in plain words, Try again, and where the logs are. Wispy looks worried,
  its spark fallen to its side. Its reason comes in the address (?reason=…&detail=…&logs=…).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deskwisp</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  [hidden] { display: none !important; }
  body { display: flex; align-items: center; justify-content: center; font: 13px/18px -apple-system, system-ui, sans-serif; color: #16132B; -webkit-app-region: drag; }
  .card { display: flex; flex-direction: column; align-items: center; max-width: 380px; padding: 0 24px; text-align: center; }
  .wisp { width: 72px; height: 72px; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; }
  p { margin: 6px 0 0; color: #6B6B6B; }
  .detail { margin-top: 10px; font: 11.5px/16px ui-monospace, SFMono-Regular, Menlo, monospace; color: #6B6B6B; word-break: break-word; -webkit-app-region: no-drag; user-select: text; }
  .actions { display: flex; gap: 8px; margin-top: 20px; -webkit-app-region: no-drag; }
  button { border: 0; border-radius: 999px; padding: 7px 14px; font: 500 13px/16px -apple-system, system-ui, sans-serif; cursor: pointer; }
  .primary { background: #16132B; color: #fff; }
  .secondary { background: #F2F2F0; color: #16132B; }
  .secondary:hover { background: #EAEAE7; }
  button:disabled { opacity: 0.5; cursor: default; }
  .logs { margin-top: 14px; font-size: 12px; color: #9A9A98; -webkit-app-region: no-drag; user-select: text; }
</style>
</head>
<body>
  <div class="card">
    <svg class="wisp" viewBox="0 0 40 40" aria-hidden="true"><path d="M21.5 2.5c-.6 3.4 1.4 5.6 4.6 7.6C31.2 13.4 35 18.2 35 24.6 35 32 28.6 37.5 20 37.5S5 32 5 24.6c0-4.9 2.6-8.8 6-11.4.1 2.4 1.2 4.1 3.1 4.9-.4-6.2 2.3-11.5 7.4-15.6z" fill="#16132B"/><path d="M25.2 15.2c2.6 1.2 4.6 3.1 5.7 5.6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".35"/><ellipse cx="15.3" cy="24.6" rx="1.9" ry="2.4" fill="#fff"/><ellipse cx="24.7" cy="24.6" rx="1.9" ry="2.4" fill="#fff"/><path d="M16.6 31.2q3.4-2.2 6.8 0" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><path d="M34.2 13.4c.3 1.9 1 2.6 2.9 2.9-1.9.3-2.6 1-2.9 2.9-.3-1.9-1-2.6-2.9-2.9 1.9-.3 2.6-1 2.9-2.9z" fill="#C9BDFF"/></svg>
    <h1 id="title">Deskwisp couldn't start</h1>
    <p id="line"></p>
    <div class="detail" id="detail" hidden></div>
    <div class="actions">
      <button class="primary" id="retry">Try again</button>
      <button class="secondary" id="logs">Show logs</button>
    </div>
    <div class="logs" id="where"></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const reason = q.get("reason") || "error";
    const detail = q.get("detail") || "";
    // What happened, and what the person can do about it. No jargon past the detail line.
    const lines = {
      "port-taken": ["Another app is using Deskwisp's spot", "Deskwisp needs port 3210 on this PC, and another app has it. Quit that app, then try again."],
      "other-deskwisp": ["Deskwisp is already open somewhere else", "Another copy of Deskwisp, maybe in another account on this PC, is using its spot. Quit it there, then try again."],
      "server-ended": ["Deskwisp stopped while starting", "Its background part closed right away. Security software sometimes stops it; the logs say why."],
      "page-failed": ["Deskwisp's window can't load", "Its page didn't load several times in the last two minutes. Try again, and if it happens again, send us the logs."],
      "page-crashed": ["Deskwisp's window keeps crashing", "Its page stopped several times in the last two minutes. Try again, and if it happens again, send us the logs."],
      "server-crashed": ["Deskwisp keeps stopping", "Its background part stopped several times in the last two minutes. Try again, and if it happens again, send us the logs."],
      "server-slow": ["Deskwisp is taking too long to start", "Its background part didn't answer in time. Try again, and if it happens again, send us the logs."],
      error: ["Deskwisp couldn't start", "Something went wrong getting ready. Try again, and if it happens again, send us the logs."],
    };
    const [title, line] = Object.hasOwn(lines, reason) ? lines[reason] : lines.error;
    document.getElementById("title").textContent = title;
    document.getElementById("line").textContent = line;
    if (detail) {
      const d = document.getElementById("detail");
      d.textContent = reason === "port-taken" || reason === "other-deskwisp" ? `Using it: ${detail}` : detail;
      d.hidden = false;
    }
    const where = q.get("logs");
    if (where) document.getElementById("where").textContent = where.replace(/^\/Users\/[^/]+/, "~");
    const mac = window.deskwispMac;
    const retry = document.getElementById("retry");
    retry.onclick = () => {
      retry.disabled = true;
      retry.textContent = "Starting…";
      Promise.resolve(mac?.startup?.retry()).catch(() => {
        retry.disabled = false;
        retry.textContent = "Try again";
      });
    };
    document.getElementById("logs").onclick = () => mac?.startup?.logs();
    if (!mac?.startup) document.querySelector(".actions").hidden = true;
  </script>
</body>
</html>
